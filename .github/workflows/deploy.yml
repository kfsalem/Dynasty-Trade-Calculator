name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Refresh the nflverse data before building. nflverse publishes as GitHub
      # release assets, which send no CORS header and run to 53 MB, so the app
      # cannot fetch any of this itself. A failed fetch here falls back to the
      # copy committed under public/data and only warns; schema drift fails.
      - run: npm run ingest
      - run: npm run build
      - uses: actions/configure-pages@v5
        # Pages must already be enabled with "Source: GitHub Actions" under
        # Settings -> Pages. Creating the Pages site needs repo admin rights,
        # which GITHUB_TOKEN does not have, so enablement:true cannot do it
        # for us. Once enabled, this step succeeds on every later run.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
